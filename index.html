<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangladesh Scouts - Ultra Smooth Assembly</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* খুব স্নিগ্ধ একটি সাদাটে গ্রেডিয়েন্ট */
            background: radial-gradient(circle at center, #ffffff 0%, #eef2f5 100%);
            overflow: hidden;
        }

        .logo-container {
            position: relative;
            width: 500px;
            height: 500px;
            /* পুরো লোগো তৈরি হওয়ার পর খুব শান্তভাবে ভাসবে */
            animation: gentleFloat 6s ease-in-out infinite 6s; 
        }

        .logo-part {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            /* সময় একটু বাড়িয়ে দেওয়া হয়েছে যাতে খুব স্মুথ দেখায় */
            animation-duration: 2s; 
            animation-fill-mode: forwards;
            /* বাটার-স্মুথ ইজিয়িং (কোনো ধাক্কা বা বাউন্স নেই) */
            animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* --- ১০টি লেয়ারের একদম স্মুথ টাইমিং --- */
        .part-1 { z-index: 1; animation-name: smoothScaleFade; animation-delay: 0.2s; }
        .part-2 { z-index: 2; animation-name: smoothSlideDown; animation-delay: 0.7s; }
        .part-3 { z-index: 3; animation-name: smoothSlideUp; animation-delay: 1.2s; }
        .part-4 { z-index: 4; animation-name: smoothSlideRight; animation-delay: 1.7s; }
        .part-5 { z-index: 5; animation-name: smoothSlideLeft; animation-delay: 2.2s; }
        .part-6 { z-index: 6; animation-name: smoothRotateFade; animation-delay: 2.7s; }
        
        /* ৭ নম্বর পার্টের জন্য আপনার কথামতো আলতো Fade Up */
        .part-7 { z-index: 7; animation-name: smoothFadeUpLeaves; animation-delay: 3.2s; }
        
        .part-8 { z-index: 8; animation-name: smoothDiagonalIn; animation-delay: 3.7s; }
        .part-9 { z-index: 9; animation-name: smoothDiagonalInAlt; animation-delay: 4.2s; }
        .part-10 { z-index: 10; animation-name: smoothCenterPop; animation-delay: 4.7s; }

        /* --- আলতো ও স্মুথ Keyframes --- */

        /* হালকা বড় হয়ে ভেসে ওঠা */
        @keyframes smoothScaleFade {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ওপর থেকে আলতো করে নামা */
        @keyframes smoothSlideDown {
            0% { transform: translateY(-40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* নিচ থেকে আলতো করে ওঠা */
        @keyframes smoothSlideUp {
            0% { transform: translateY(40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* বাম থেকে আলতো করে আসা */
        @keyframes smoothSlideRight {
            0% { transform: translateX(-40px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        /* ডান থেকে আলতো করে আসা */
        @keyframes smoothSlideLeft {
            0% { transform: translateX(40px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        /* হালকা ঘুরে ভেসে ওঠা */
        @keyframes smoothRotateFade {
            0% { transform: rotate(-10deg) scale(0.95); opacity: 0; }
            100% { transform: rotate(0) scale(1); opacity: 1; }
        }

        /* ৭ নম্বর পার্টের নির্দিষ্ট Fade Up */
        @keyframes smoothFadeUpLeaves {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* কোণাকুণি আলতো করে আসা */
        @keyframes smoothDiagonalIn {
            0% { transform: translate(-20px, -20px); opacity: 0; }
            100% { transform: translate(0, 0); opacity: 1; }
        }

        @keyframes smoothDiagonalInAlt {
            0% { transform: translate(20px, 20px); opacity: 0; }
            100% { transform: translate(0, 0); opacity: 1; }
        }

        /* একদম শেষের পার্টটি স্নিগ্ধভাবে বসে যাওয়া */
        @keyframes smoothCenterPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 8px rgba(237,28,36,0.2)); }
        }

        /* খুব ধীর এবং স্নিগ্ধ ভাসমান ইফেক্ট */
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="photos/bs logo (1).png" alt="Part 1" class="logo-part part-1">
        <img src="photos/bs logo (2).png" alt="Part 2" class="logo-part part-2">
        <img src="photos/bs logo (3).png" alt="Part 3" class="logo-part part-3">
        <img src="photos/bs logo (4).png" alt="Part 4" class="logo-part part-4">
        <img src="photos/bs logo (5).png" alt="Part 5" class="logo-part part-5"> 
        <img src="photos/bs logo (6).png" alt="Part 6" class="logo-part part-6">
        <img src="photos/bs logo (7).png" alt="Part 7" class="logo-part part-7">
        <img src="photos/bs logo (8).png" alt="Part 8" class="logo-part part-8">
        <img src="photos/bs logo (9).png" alt="Part 9" class="logo-part part-9">
        <img src="photos/bs logo (10).png" alt="Part 10" class="logo-part part-10">
    </div>

</body>
</html>
