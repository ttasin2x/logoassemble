<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangladesh Scouts Logo Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* হালকা একটি গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড, যাতে সাদা বৃত্তটি স্পষ্ট বোঝা যায় */
            background: radial-gradient(circle, #f8f9fa, #ced4da); 
            overflow: hidden;
        }

        .logo-container {
            position: relative;
            width: 500px;
            height: 500px;
            animation: pulseGlow 3s infinite alternate 4s; 
        }

        .logo-part {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            animation-duration: 1.2s;
            animation-fill-mode: forwards;
            animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* লেয়ার ১: বাইরের লাল চাঁদ - নিচ থেকে জুম হয়ে আসবে */
        .layer-1 {
            z-index: 1;
            animation-name: zoomIn;
            animation-delay: 0.2s;
        }

        /* লেয়ার ২: ভেতরের সাদা বৃত্ত - ওপর থেকে ঘুরে আসবে */
        .layer-2 {
            z-index: 2;
            animation-name: spinDrop;
            animation-delay: 1.2s;
        }

        /* লেয়ার ৩: ওপরের সবুজ লিলি ও লাল বৃত্ত - বাঁ থেকে স্লাইড করে আসবে */
        .layer-3 {
            z-index: 3;
            animation-name: slideRight;
            animation-delay: 2.0s;
        }

        /* লেয়ার ৪: নিচের সবুজ অংশ - ডান থেকে স্লাইড করে আসবে */
        .layer-4 {
            z-index: 4;
            animation-name: slideLeft;
            animation-delay: 2.8s;
        }

        /* --- Keyframes --- */

        @keyframes zoomIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes spinDrop {
            0% { transform: translateY(-200px) rotate(-180deg) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
        }

        @keyframes slideRight {
            0% { transform: translateX(-200px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideLeft {
            0% { transform: translateX(200px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 10px rgba(0, 166, 81, 0.2)); }
            100% { filter: drop-shadow(0 0 25px rgba(237, 28, 36, 0.6)); }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="bs logo (4).png" alt="Outer Crescent" class="logo-part layer-1">
        <img src="bs logo (3).png" alt="White Circle" class="logo-part layer-2">
        <img src="bs logo (1).png" alt="Top Lily" class="logo-part layer-3">
        <img src="bs logo (2).png" alt="Bottom Lily" class="logo-part layer-4">
    </div>

</body>
</html>
