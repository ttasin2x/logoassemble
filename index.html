<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangladesh Scouts - Cinematic Assembly</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* একটি সুন্দর ও প্রিমিয়াম গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড */
            background: radial-gradient(circle at center, #ffffff 0%, #e0e5ec 100%);
            overflow: hidden;
        }

        .logo-container {
            position: relative;
            width: 500px;
            height: 500px;
            /* সবগুলো পার্ট আসার পর দারুণ একটি ভাসমান গ্লো শুরু হবে */
            animation: premiumFloat 4s ease-in-out infinite 7s; 
            /* ৩ডি ইফেক্টের জন্য */
            perspective: 1000px; 
        }

        .logo-part {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            animation-duration: 1.5s;
            animation-fill-mode: forwards;
            /* দারুণ একটি স্প্রিং/বাউন্সি ইজিয়িং */
            animation-timing-function: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* --- ১০টি লেয়ারের আকর্ষণীয় সিনেমাটিক টাইমিং ও ইফেক্ট --- */
        .part-1 { z-index: 1; animation-name: cinematicFlip; animation-delay: 0.2s; }
        .part-2 { z-index: 2; animation-name: springDrop; animation-delay: 0.8s; }
        .part-3 { z-index: 3; animation-name: riseFromAbyss; animation-delay: 1.4s; }
        .part-4 { z-index: 4; animation-name: swirlLeft; animation-delay: 2.0s; }
        .part-5 { z-index: 5; animation-name: swirlRight; animation-delay: 2.6s; } 
        .part-6 { z-index: 6; animation-name: helixZoom; animation-delay: 3.2s; }
        
        /* ৭ নম্বর পার্টের জন্য নতুন স্মুথ Fade Up ইফেক্ট */
        .part-7 { 
            z-index: 7; 
            animation-name: fadeUpLeaves; 
            animation-delay: 3.8s; 
            animation-duration: 1.2s; 
            /* Fade Up এর জন্য নরমাল স্মুথ টাইমিং */
            animation-timing-function: ease-out; 
        }
        
        .part-8 { z-index: 8; animation-name: elasticDiagonal; animation-delay: 4.4s; }
        .part-9 { z-index: 9; animation-name: meteorStrike; animation-delay: 5.0s; }
        .part-10 { z-index: 10; animation-name: supernovaPop; animation-delay: 5.6s; }

        /* --- সিনেমাটিক Keyframes --- */

        @keyframes cinematicFlip {
            0% { transform: rotateX(90deg) scale(0.5); opacity: 0; }
            100% { transform: rotateX(0deg) scale(1); opacity: 1; }
        }

        @keyframes springDrop {
            0% { transform: translateY(-150%) scaleY(1.5); opacity: 0; }
            50% { transform: translateY(10%) scaleY(0.9); opacity: 1; }
            100% { transform: translateY(0) scaleY(1); opacity: 1; }
        }

        @keyframes riseFromAbyss {
            0% { transform: translateY(100px) scale(0.8); opacity: 0; filter: blur(5px); }
            100% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
        }

        @keyframes swirlLeft {
            0% { transform: translateX(-200px) rotate(-180deg) scale(0.5); opacity: 0; }
            100% { transform: translateX(0) rotate(0) scale(1); opacity: 1; }
        }
        
        @keyframes swirlRight {
            0% { transform: translateX(200px) rotate(180deg) scale(0.5); opacity: 0; }
            100% { transform: translateX(0) rotate(0) scale(1); opacity: 1; }
        }

        @keyframes helixZoom {
            0% { transform: scale(3) rotate(90deg); opacity: 0; filter: blur(10px); }
            100% { transform: scale(1) rotate(0); opacity: 1; filter: blur(0); }
        }

        /* ৭ নম্বর পার্টের নতুন Fade Up অ্যানিমেশন */
        @keyframes fadeUpLeaves {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes elasticDiagonal {
            0% { transform: translate(150px, -150px) scale(0.5); opacity: 0; }
            100% { transform: translate(0, 0) scale(1); opacity: 1; }
        }

        @keyframes meteorStrike {
            0% { transform: translateY(-200px) scale(1.5); opacity: 0; }
            80% { transform: translateY(10px) scale(0.9); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes supernovaPop {
            0% { transform: scale(0); opacity: 0; filter: brightness(3); }
            70% { transform: scale(1.3); opacity: 1; filter: brightness(2) drop-shadow(0 0 20px #fff); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }

        @keyframes premiumFloat {
            0% { transform: translateY(0px); filter: drop-shadow(0 10px 15px rgba(0, 166, 81, 0.2)); }
            50% { transform: translateY(-15px); filter: drop-shadow(0 25px 30px rgba(237, 28, 36, 0.4)); }
            100% { transform: translateY(0px); filter: drop-shadow(0 10px 15px rgba(0, 166, 81, 0.2)); }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="photos/bs logo (1).png" alt="Part 1" class="logo-part part-1">
        <img src="photos/bs logo (2).png" alt="Part 2" class="logo-part part-2">
        <img src="photos/bs logo (3).png" alt="Part 3" class="logo-part part-3">
        <img src="photos/bs logo (4).png" alt="Part 4" class="logo-part part-4">
        <img src="photos/bs logo (5).png" alt="Part 5" class="logo-part part-5"> 
        <img src="photos/bs logo (6).png" alt="Part 6" class="logo-part part-6">
        <img src="photos/bs logo (7).png" alt="Part 7" class="logo-part part-7">
        <img src="photos/bs logo (8).png" alt="Part 8" class="logo-part part-8">
        <img src="photos/bs logo (9).png" alt="Part 9" class="logo-part part-9">
        <img src="photos/bs logo (10).png" alt="Part 10" class="logo-part part-10">
    </div>

</body>
</html>
